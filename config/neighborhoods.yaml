# Each neighborhood as the portals name it in their URLs. Only entries checked
# against the live portal belong here; a wrong slug makes a portal silently
# search somewhere else.
#
# `name` is how the portals write it in a results page heading; the scraper
# checks that heading to catch a URL the portal misread.
florida:                         # Vicente López
  name: Florida
  zonaprop: florida              # not florida-vicente-lopez: that is the whole partido
  argenprop: florida
  mercadolibre: bsas-gba-norte/vicente-lopez/florida/
  mashogares: Buenos Aires       # also returns Florida Oeste and Villa La Florida; the spider drops them
olivos:                          # Vicente López
  name: Olivos
  zonaprop: olivos
  argenprop: olivos
  mercadolibre: bsas-gba-norte/vicente-lopez/olivos/
  mashogares: Buenos Aires
saavedra:                        # CABA
  name: Saavedra
  zonaprop: saavedra
  argenprop: saavedra
  # The CABA places end in a code that MercadoLibre gives to the whole city.
  mercadolibre: capital-federal/saavedra/capital-federal-tuxbqknprzy5mtza
  # Not "Buenos Aires": that province has its own, unrelated Saavedra.
  mashogares: Ciudad Autónoma de Buenos Aires
coghlan:                         # CABA
  name: Coghlan
  zonaprop: coghlan
  # Not checked on the live portal: ArgenProp was blocking every request when this
  # was added. It follows the pattern of the other entries; if it is wrong, the
  # heading check fails the ArgenProp run instead of searching somewhere else.
  argenprop: coghlan
  mercadolibre: capital-federal/coghlan/capital-federal-tuxbqknprzy5mtza
  mashogares: Ciudad Autónoma de Buenos Aires
