# Each neighborhood as the portals name it in their URLs. Only entries checked
# against the live portal belong here; a wrong slug makes a portal silently
# search somewhere else.
#
# `name` is how the portals write it in a results page heading; the scraper
# checks that heading to catch a URL the portal misread.
florida:                         # Vicente López
  name: Florida
  zonaprop: florida              # not florida-vicente-lopez: that is the whole partido
  argenprop: florida
olivos:                          # Vicente López
  name: Olivos
  zonaprop: olivos
  argenprop: olivos
saavedra:                        # CABA
  name: Saavedra
  zonaprop: saavedra
  argenprop: saavedra
coghlan:                         # CABA
  name: Coghlan
  zonaprop: coghlan
  # Not checked on the live portal: ArgenProp was blocking every request when this
  # was added. It follows the pattern of the other entries; if it is wrong, the
  # heading check fails the ArgenProp run instead of searching somewhere else.
  argenprop: coghlan
