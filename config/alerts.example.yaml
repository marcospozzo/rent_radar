# Sample configuration. Copy it to alerts.yaml, which git ignores, and edit that
# copy: it holds what you are looking for, which is personal.
#
# Where the alerts go. Each service points at a file holding one Apprise URL,
# because the URL carries a password and must stay out of git. Keep it in this
# folder as apprise-url.txt (git ignores it); the folder is mounted at /app/config.
# For Gmail the file holds, on one line and without quotes:
#   mailto://user:app-password@gmail.com?to=you@example.com
# Several recipients go in `to=` separated by commas.
apprise:
  services:
    - url_file: /app/config/apprise-url.txt
      label: gmail

# An email when a portal stops returning data (blocked, down), and another when it
# comes back. Without it a block is silent: the alerts just stop arriving.
health:
  enabled: true

# Every alert is looked up on every portal listed here. Delete a portal from the
# list to switch it off, for instance while it blocks the scraper; the health
# email stops watching it too. Without this list all four are used. mashogares
# (Más Hogares BNA) only has properties for sale, so rent alerts skip it.
portals: [zonaprop, argenprop, mercadolibre, mashogares]

# What to look for. Portals filter by URL, and dbt applies these criteria again
# on top, because portals ignore or misread some filters.
#
# Each alert is one operation, `rent` or `sale`, with its own price. To look for
# both, write two alerts: that way each can ask for different property types,
# rooms or neighborhoods (houses to buy, PHs to rent).
#
# Every key an alert accepts is in the first one below; the ones marked optional
# can be left out. An unknown key is an error, so a typo does not go unnoticed.
alerts:
  - id: norte-alquiler          # lowercase words joined by "-"; unique across alerts
    operation: rent             # rent | sale
    active: true                # optional, default true; false pauses the alert
    # delivery (optional, default digest): digest sends one email per cycle with
    # everything new; each sends one email per listing.
    delivery: digest
    # to (optional) lists the addresses this alert's emails go to; without it they
    # go to the address in the Apprise URL, and so do the health emails. Use it for
    # alerts that are for someone else, with the id prefixed by the person.
    # Addresses live only in alerts.yaml, which git ignores. Needs an email
    # (mailto) Apprise URL.
    # to: [friend@example.com]
    # Keys of config/neighborhoods.yaml.
    neighborhoods: [florida, olivos, saavedra]
    property_types: [casa, ph, departamento]    # casa | ph | departamento
    rooms: { min: 3, max: 5 }   # max is optional
    min_garage: 1               # optional, default 0 (no requirement)
    min_area_m2: 70             # optional, covered area in m2
    # price.min and price.max are both optional, alone or together. The minimum
    # compares the listing's price alone; the maximum adds the expensas.
    price: { currency: ARS, min: 1000000, max: 2000000 }    # currency: ARS | USD

  # The smallest alert: only the required keys.
  - id: norte-venta
    operation: sale
    neighborhoods: [florida, olivos, saavedra]
    property_types: [casa, ph]
    rooms: { min: 3 }
    price: { currency: USD, max: 200000 }
