# Sample configuration. Copy it to alerts.yaml, which git ignores, and edit that
# copy: it holds what you are looking for, which is personal.
#
# Where the alerts go. Each service points at a file holding one Apprise URL,
# because the URL carries a password and must stay out of git. Keep it in this
# folder as apprise-url.txt (git ignores it); the folder is mounted at /app/config.
# For Gmail the file holds, on one line and without quotes:
#   mailto://user:app-password@gmail.com?to=you@example.com
# Several recipients go in `to=` separated by commas.
apprise:
  services:
    - url_file: /app/config/apprise-url.txt
      label: gmail

# An email when a portal stops returning data (blocked, down), and another when it
# comes back. Without it a block is silent: the alerts just stop arriving.
health:
  enabled: true

# What to look for. Portals filter by URL, and dbt applies these criteria again
# on top, because portals ignore or misread some filters.
#
# Each alert is one operation, `rent` or `sale`, with its own price. To look for
# both, write two alerts: that way each can ask for different property types,
# rooms or neighborhoods (houses to buy, PHs to rent).
#
# delivery: digest (default) sends one email per cycle with everything new;
# each sends one email per listing.
#
# price.min and price.max are both optional, alone or together. The minimum
# compares the listing's price alone; the maximum adds the expensas.
#
# to (optional) lists the addresses an alert's emails go to; without it they go to
# the address in the Apprise URL, and so do the health emails. Use it for alerts
# that are for someone else, with the id prefixed by the person. Addresses live
# only in alerts.yaml, which git ignores. Needs an email (mailto) Apprise URL.
#
# A portal with `urls` uses them as written instead of a generated URL. Use it
# when a portal's URL rules are not supported or have changed.
alerts:
  - id: norte-alquiler
    operation: rent
    delivery: digest
    # to: [friend@example.com]
    neighborhoods: [florida, olivos, saavedra]
    property_types: [casa, ph, departamento]
    rooms: { min: 3 }
    price: { currency: ARS, min: 1000000, max: 2000000 }
    portals:
      zonaprop: { max_pages: 20 }
      argenprop: { max_pages: 20 }
      mercadolibre: { max_pages: 20 }

  - id: norte-venta
    operation: sale
    min_garage: 1
    delivery: digest
    neighborhoods: [florida, olivos, saavedra]
    property_types: [casa, ph]
    rooms: { min: 3 }
    price: { currency: USD, min: 100000, max: 200000 }
    portals:
      zonaprop: { max_pages: 20 }
      argenprop: { max_pages: 20 }
      mercadolibre: { max_pages: 20 }
