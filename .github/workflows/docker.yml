name: Docker image

# Builds the image on every push to master and publishes it to GitHub Container
# Registry, so the server only has to `docker compose pull`. It can also be run by
# hand from the Actions tab.
on:
  push:
    branches: [master]
  workflow_dispatch:

# A newer push makes the build in progress for the same ref obsolete.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    # A hung build (it has happened locally) should not hold the runner for hours.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to ghcr.io with the workflow's own token; no secrets needed
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rent-radar
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          # The homelab is an Intel machine; the runner is amd64 too, so no emulation.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A plain image manifest: without it the registry also stores an
          # attestation entry that shows up as an extra "unknown" platform.
          provenance: false
