name: rent-radar

x-app: &app
  build: .
  image: rent-radar:dev
  environment: &app-environment
    # The variable keeps its upstream name, but it points at the local database.
    NEON_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    DBT_PROFILES_DIR: /app/analytics
    DBT_HOST: db
    DBT_PORT: "5432"
    DBT_USER: ${POSTGRES_USER}
    DBT_PASSWORD: ${POSTGRES_PASSWORD}
    DBT_DBNAME: ${POSTGRES_DB}
    DBT_SSLMODE: disable
  # Chromium crashes with the default 64 MB /dev/shm.
  shm_size: 1gb

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Loopback only. 5433 is taken by another project on this machine.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Applies the sql/ files this database has not seen yet, then exits.
  migrate:
    <<: *app
    command: ["python", "jobs/migrate.py"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  prefect-server:
    <<: *app
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_HOME: /data/prefect
      # Wait up to 60 s for SQLite's write lock instead of failing on contention.
      PREFECT_API_DATABASE_CONNECTION_URL: sqlite+aiosqlite:////data/prefect/prefect.db?timeout=60
      # URL the browser uses to reach the API from the host.
      PREFECT_UI_API_URL: http://localhost:${PREFECT_PORT:-4200}/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      # The server copies its UI build somewhere writable at startup; the default
      # is inside the root-owned venv, so the non-root user cannot and the UI
      # silently does not load.
      PREFECT_UI_STATIC_DIRECTORY: /data/prefect/ui
    volumes:
      - prefect-data:/data/prefect
    ports:
      - "127.0.0.1:${PREFECT_PORT:-4200}:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Registers the work pool and the three deployments from prefect.yaml, then exits.
  prefect-deploy:
    <<: *app
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    command:
      - sh
      - -c
      - >
        prefect work-pool inspect local >/dev/null 2>&1
        || prefect work-pool create local --type process;
        prefect --no-prompt deploy --all
    restart: "no"

  worker:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      prefect-deploy:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      PREFECT_API_URL: http://prefect-server:4200/api
    command: ["prefect", "worker", "start", "--pool", "local", "--type", "process"]
    volumes:
      # Edited on the host and read each cycle, so a change needs no rebuild.
      - ./alerts.yaml:/app/alerts.yaml:ro
      - type: bind
        source: ${APPRISE_URL_FILE:?set APPRISE_URL_FILE in .env}
        target: /run/secrets/apprise-gmail
        read_only: true
        bind:
          # Fail loudly: otherwise Docker creates a directory where the file should be.
          create_host_path: false
    restart: unless-stopped

  # One-off commands: `docker compose run --rm app python jobs/run_dbt.py`.
  app:
    <<: *app
    # Never started by `up`; `docker compose run` still works with a profile.
    profiles: ["tools"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./alerts.yaml:/app/alerts.yaml:ro
      - type: bind
        source: ${APPRISE_URL_FILE:?set APPRISE_URL_FILE in .env}
        target: /run/secrets/apprise-gmail
        read_only: true
        bind:
          # Fail loudly: otherwise Docker creates a directory where the file should be.
          create_host_path: false
    restart: "no"

  # Development mail catcher: `docker compose --profile dev up -d mailpit`, then open
  # http://127.0.0.1:8025. Point the Apprise URL file at SMTP host `mailpit`, port 1025.
  mailpit:
    image: axllent/mailpit:v1.33.0
    profiles: ["dev"]
    environment:
      # Apprise logs in even when the server does not ask for it.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025"
    restart: "no"

volumes:
  db-data:
  prefect-data:
